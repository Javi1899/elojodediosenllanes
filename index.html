      color: var(--border);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);

    .subtitle { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    .hud-controls { display: flex; align-items: center; gap: 12px; font-size: 12px; }
    .badge {

      background: rgba(0, 240, 255, 0.06);
      padding: 4px 10px;
      border-radius: 3px;
      color: var(--accent);

      font-size: 12px;

      text-transform: uppercase;
      letter-spacing: 1px;

    button.hud-btn:hover {

    .cam-item {

      cursor: pointer;

    .radar-marker { position: relative; width: 22px; height: 22px; }
    .radar-marker .core {
      position: absolute; top: 5px; left: 5px;
      width: 12px; height: 12px;
      background: var(--accent);
      border: 2px solid #041014;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }
    .radar-marker .ring {
      position: absolute; top: 0; left: 0;
      width: 22px; height: 22px;
      border: 1px solid var(--border);
      border-radius: 50%;
      animation: ping 2.2s infinite;
    }

    /* Marcador Radar DGT (Ámbar tráfico) */
    .radar-marker.dgt .core {
      background: var(--dgt);
      box-shadow: 0 0 12px var(--dgt);
    }
    .radar-marker.dgt .ring {
      border-color: var(--dgt);
    }

    .radar-marker.meteo .core {
      background: var(--meteo);
      box-shadow: 0 0 12px var(--meteo);
    }
    .radar-marker.meteo .ring {
      border-color: var(--meteo);
    }

    @keyframes ping {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.1); opacity: 0; }

      color: var(--text) !important;
      border: 1px solid var(--border) !important;

      border-color: rgba(255, 170, 0, 0.45);

    .scanline {
      position: absolute; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 240, 255, 0.04) 50%);

      gap: 6px;
      margin-top: 6px;

      background: rgba(6, 26, 40, 0.78);
      border: 1px solid rgba(56, 189, 248, 0.32);
      padding: 7px 8px;
    }
    .meteo-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .meteo-val {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }
    .meteo-val.temp { color: var(--meteo); }
    .meteo-val.wind { color: var(--accent); }
    .meteo-val.rain { color: #60a5fa; }

    .popup-footer {
      margin-top: 8px; display: flex; justify-content: space-between;
      align-items: center; gap: 8px; font-size: 10px; color: var(--muted);
    }
    .btn-open {
      display: inline-block; text-decoration: none;
      background: var(--accent); color: #02080a; font-weight: bold;
      padding: 5px 10px; font-size: 11px; border-radius: 2px;
      text-transform: uppercase; transition: 0.15s;
    }
    .btn-open.dgt { background: var(--dgt); color: #090500; }
    .btn-open.meteo { background: var(--meteo); color: #02080a; }
    .btn-open:hover { background: #fff; box-shadow: 0 0 10px var(--accent); }

    @media (max-width: 768px) { aside { display: none; } }
  </style>
</head>
