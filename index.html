      background: var(--bg);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 54px;
      background: linear-gradient(90deg, #060c10 0%, #0a1820 50%, #060c10 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 1000;
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.18);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .radar-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }
    h1 {
      font-size: 16px; letter-spacing: 2px;
      color: var(--border);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }
    .subtitle { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    .hud-controls { display: flex; align-items: center; gap: 12px; font-size: 12px; }
    .badge {
      border: 1px solid var(--border-dim);
      background: rgba(0, 240, 255, 0.06);
      padding: 4px 10px;
      border-radius: 3px;
      color: var(--accent);
    }
    button.hud-btn {
      background: rgba(0, 240, 255, 0.12);
      color: var(--border);
      border: 1px solid var(--border);
      padding: 5px 12px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: 0.2s;
    }
    button.hud-btn:hover {
      background: var(--border);
      color: #000;
      box-shadow: 0 0 12px var(--border);
    }

    .workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
    #map { flex: 1; height: 100%; background: #030608; }

    aside {
      width: 325px;
      background: var(--panel);
      border-right: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      z-index: 900;
    }
    .aside-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-dim);
      font-size: 11px;
      color: var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cam-list { flex: 1; overflow-y: auto; padding: 8px; }
    .cam-list::-webkit-scrollbar { width: 5px; }
    .cam-list::-webkit-scrollbar-thumb { background: var(--border-dim); }
    .cam-item {
      border: 1px solid rgba(0, 240, 255, 0.15);
      background: rgba(0, 20, 28, 0.55);
      padding: 9px 11px;
      margin-bottom: 7px;
      cursor: pointer;
      transition: 0.18s;
    }
    .cam-item:hover, .cam-item.active {
      border-color: var(--border);
      background: rgba(0, 240, 255, 0.14);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .cam-item.dgt-item {
      border-color: rgba(255, 170, 0, 0.35);
      background: rgba(35, 22, 5, 0.55);
    }
    .cam-item.dgt-item:hover, .cam-item.dgt-item.active {
      border-color: var(--dgt);
      background: rgba(255, 170, 0, 0.16);
      box-shadow: inset 3px 0 0 var(--dgt);
    }
    .cam-item.meteo-item {
      border-color: rgba(56, 189, 248, 0.38);
      background: rgba(6, 28, 44, 0.65);
    }
    .cam-item.meteo-item:hover, .cam-item.meteo-item.active {
      border-color: var(--meteo);
      background: rgba(56, 189, 248, 0.18);
      box-shadow: inset 3px 0 0 var(--meteo);
    }
    .cam-item-title { font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 3px; }
    .cam-item-meta { font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; }

    /* Marcador Radar estándar */
    .radar-marker { position: relative; width: 22px; height: 22px; }
    .radar-marker .core {
      position: absolute; top: 5px; left: 5px;
      width: 12px; height: 12px;
      background: var(--accent);
      border: 2px solid #041014;
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }
    .radar-marker .ring {
      position: absolute; top: 0; left: 0;
      width: 22px; height: 22px;
      border: 1px solid var(--border);
      border-radius: 50%;
      animation: ping 2.2s infinite;
    }

    /* Marcador Radar DGT (Ámbar tráfico) */
    .radar-marker.dgt .core {
      background: var(--dgt);
      box-shadow: 0 0 12px var(--dgt);
    }
    .radar-marker.dgt .ring {
      border-color: var(--dgt);
    }

    /* Marcador Radar AEMET (Azul meteo) */
    .radar-marker.meteo .core {
      background: var(--meteo);
      box-shadow: 0 0 12px var(--meteo);
    }
    .radar-marker.meteo .ring {
      border-color: var(--meteo);
    }

    @keyframes ping {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    /* Popup Táctico Leaflet */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: rgba(6, 12, 16, 0.97) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: 2px !important;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.4) !important;

      margin: 10px !important;
      width: 320px !important;
      font-family: 'Consolas', 'Courier New', monospace;

    .popup-header {

      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 5px; margin-bottom: 8px; font-size: 11px;
    }
    .popup-id { color: var(--accent); font-weight: bold; }
    .popup-id.dgt { color: var(--dgt); }
    .popup-id.meteo { color: var(--meteo); }
    .popup-title { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 6px; }

    .player-viewport {
      position: relative;
      width: 300px;
      height: 174px;
      background: #020507;
      border: 1px solid var(--border-dim);
      overflow: hidden;
    }
    .player-viewport img.cam-crop {
      position: absolute;
      max-width: none;
      height: auto;
      display: block;
    }
    .frame-status {
      position: absolute; top: 5px; left: 5px;
      background: rgba(2, 8, 10, 0.82);
      border: 1px solid var(--border-dim);
      color: var(--accent);
      font-size: 9px; padding: 2px 6px; z-index: 3;
    }
    .frame-status.dgt {
      color: var(--dgt);
      border-color: rgba(255, 170, 0, 0.45);
    }
    .scanline {
      position: absolute; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 240, 255, 0.04) 50%);
      background-size: 100% 4px; pointer-events: none; z-index: 2;
    }

    /* Panel telemétrico AEMET */
    .meteo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }
    .meteo-box {
      background: rgba(6, 26, 40, 0.78);
      border: 1px solid rgba(56, 189, 248, 0.32);
      padding: 7px 8px;
    }
    .meteo-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .meteo-val {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
    }
    .meteo-val.temp { color: var(--meteo); }
    .meteo-val.wind { color: var(--accent); }
    .meteo-val.rain { color: #60a5fa; }

    .popup-footer {
      margin-top: 8px; display: flex; justify-content: space-between;
      align-items: center; gap: 8px; font-size: 10px; color: var(--muted);
    }
    .btn-open {
      display: inline-block; text-decoration: none;
      background: var(--accent); color: #02080a; font-weight: bold;
      padding: 5px 10px; font-size: 11px; border-radius: 2px;
      text-transform: uppercase; transition: 0.15s;
    }
    .btn-open.dgt { background: var(--dgt); color: #090500; }
    .btn-open.meteo { background: var(--meteo); color: #02080a; }
    .btn-open:hover { background: #fff; box-shadow: 0 0 10px var(--accent); }

    @media (max-width: 768px) { aside { display: none; } }

    function formatWindDir(deg) {
      if (deg === undefined || deg === null) return "";
      const dirs = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
      return dirs[Math.round(deg / 45) % 8];
    }

    function buildMeteoPopupHTML(st) {
      const d = st.data;
      const temp = d && d.ta !== undefined ? `${d.ta} °C` : "S/D";
      const windSpeed = d && d.vv !== undefined ? `${(d.vv * 3.6).toFixed(1)} km/h ${formatWindDir(d.dv)}` : "S/D";

            <span class="popup-id meteo">${st.emaCode} · METEO</span>
            <span>${st.lat.toFixed(4)}, ${st.lng.toFixed(4)}</span>

            </div>
            <div class="meteo-box">

              <div class="meteo-val wind">${windSpeed}</div>
            </div>
            <div class="meteo-box">
              <div class="meteo-label">Racha Máxima</div>
              <div class="meteo-val">${gust}</div>
            </div>
            <div class="meteo-box">
              <div class="meteo-label">Precipitación</div>
              <div class="meteo-val rain">${rain}</div>
            </div>
            <div class="meteo-box">
              <div class="meteo-label">Humedad Relativa</div>
              <div class="meteo-val">${hum}</div>
            </div>
            <div class="meteo-box">
              <div class="meteo-label">Presión Atm.</div>
              <div class="meteo-val">${pres}</div>
            </div>
          </div>
          <div class="popup-footer">
            <span>CLOUDFLARE · AEMET</span>
            <a class="btn-open meteo" href="${st.url}" target="_blank" rel="noopener noreferrer">Ficha AEMET ↗</a>
          </div>
        </div>
      `;
    }

    function buildPopupHTML(cam) {
      if (cam.type === "meteo") return buildMeteoPopupHTML(cam);
      const isDgt = cam.type === "dgt";
      return `
        <div>
          <div class="popup-header">
            <span class="popup-id ${isDgt ? 'dgt' : ''}">CAM #${cam.id} · ${cam.zone.toUpperCase()}</span>
            <span>${cam.lat.toFixed(4)}, ${cam.lng.toFixed(4)}</span>
          </div>
          <div class="popup-title">${cam.name}</div>
          <div class="player-viewport">
            <img class="cam-crop"
                 src="${getCroppedPlayerUrl(cam)}"
                 style="width:${cam.imgWidth}px; left:${cam.offsetX}px; top:${cam.offsetY}px;"
                 alt="${cam.name}" />
            <div class="frame-status ${isDgt ? 'dgt' : ''}">${isDgt ? 'TRÁFICO DGT · A-8' : 'NODO #' + cam.id}</div>
            <div class="scanline"></div>
          </div>
          <div class="popup-footer">
            <span>AUTO-REFRESCO: 60s</span>
            <a class="btn-open ${isDgt ? 'dgt' : ''}" href="${cam.url}" target="_blank" rel="noopener noreferrer">${isDgt ? 'Abrir DGT ↗' : 'Abrir Webcam ↗'}</a>
          </div>
        </div>
      `;
    }

    const webRadarIcon = L.divIcon({
      className: 'custom-radar-icon',
      html: `<div class="radar-marker"><div class="ring"></div><div class="core"></div></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11],
      popupAnchor: [0, -10]
    });

    const dgtRadarIcon = L.divIcon({
      className: 'custom-radar-icon-dgt',
      html: `<div class="radar-marker dgt"><div class="ring"></div><div class="core"></div></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11],
      popupAnchor: [0, -10]
    });

    const meteoRadarIcon = L.divIcon({
      className: 'custom-radar-icon-meteo',
      html: `<div class="radar-marker meteo"><div class="ring"></div><div class="core"></div></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11],
      popupAnchor: [0, -10]
    });

    const listContainer = document.getElementById('cam-list');
    const ALL_NODES = [...AEMET_STATIONS, ...CAMERAS];

    ALL_NODES.forEach((node) => {
      const isDgt = node.type === "dgt";
      const isMeteo = node.type === "meteo";
      const iconToUse = isMeteo ? meteoRadarIcon : (isDgt ? dgtRadarIcon : webRadarIcon);

      const marker = L.marker([node.lat, node.lng], {
        icon: iconToUse
      }).addTo(map);

      marker.bindPopup(() => buildPopupHTML(node), {
        closeButton: true,
        autoPan: true
      });

      marker.on('mouseover', function () {
        this.openPopup();
        highlightSidebar(node.id);
      });

      markers[node.id] = marker;

      const item = document.createElement('div');
      item.className = `cam-item ${isDgt ? 'dgt-item' : ''} ${isMeteo ? 'meteo-item' : ''}`;
      item.id = `sidebar-cam-${node.id}`;
      item.innerHTML = `
        <div class="cam-item-title">${node.name}</div>
        <div class="cam-item-meta">
          <span>${node.zone}</span>
          <span id="meta-${node.id}">${isMeteo ? 'AEMET LIVE' : (isDgt ? 'DGT A-8' : 'ID #' + node.id)}</span>
        </div>
      `;
      item.addEventListener('mouseenter', () => {
        map.panTo([node.lat, node.lng], { animate: true, duration: 0.4 });
        marker.openPopup();
        highlightSidebar(node.id);
      });
      item.addEventListener('click', () => {
        map.setView([node.lat, node.lng], 15);
        marker.openPopup();
      });
      listContainer.appendChild(item);
    });

    function highlightSidebar(id) {
      document.querySelectorAll('.cam-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`sidebar-cam-${id}`);
      if (activeEl) activeEl.classList.add('active');
    }

    async function fetchAemetLlanes() {
      const statusEl = document.getElementById('aemet-status');
      try {
        const resData = await fetch(
          `${WORKER_AEMET_URL}?api_key=${encodeURIComponent(AEMET_API_KEY)}`
        );
        if (!resData.ok) throw new Error(`HTTP ${resData.status}`);
        const observations = await resData.json();
        if (!Array.isArray(observations)) throw new Error("Respuesta AEMET no válida");

        // Buscar todas las estaciones en el concejo de Llanes (Llanes y Niembru-Llanes)
        const llanesObs = observations.filter(o => {
          const ubi = (o.ubi || "").toUpperCase();
          return (
            ubi.includes("LLANES") ||
            ubi.includes("NIEMBRU") ||
            ubi.includes("NIEMBRO") ||
            (o.lat >= 43.36 && o.lat <= 43.47 && o.lon >= -4.96 && o.lon <= -4.64)
          );
        });

        const latestByStation = {};
        llanesObs.forEach(obs => {
          if (!latestByStation[obs.idema] || obs.fint > latestByStation[obs.idema].fint) {
            latestByStation[obs.idema] = obs;
          }
        });

        const stationList = Object.values(latestByStation);
        let activeCount = 0;

        AEMET_STATIONS.forEach((st) => {
          const matched = stationList.find(s => {
            const ubi = (s.ubi || "").toUpperCase();
            const hasInclude = st.matchKeywords.some(k => ubi.includes(k));
            const hasExclude = st.excludeKeywords.some(k => ubi.includes(k));
            return hasInclude && !hasExclude;
          });

          if (matched) {
            activeCount++;
            st.data = matched;
            st.emaCode = matched.idema || st.emaCode;
            st.url = `https://www.aemet.es/es/eltiempo/observacion/ultimosdatos?k=ast&l=${st.emaCode}`;
            if (matched.lat && matched.lon) {
              st.lat = matched.lat;
              st.lng = matched.lon;
              markers[st.id].setLatLng([st.lat, st.lng]);
            }
            if (matched.ubi) {
              st.name = `AEMET · ${matched.ubi}`;
              const titleEl = document.querySelector(`#sidebar-cam-${st.id} .cam-item-title`);
              if (titleEl) titleEl.textContent = st.name;
            }
            const metaEl = document.getElementById(`meta-${st.id}`);
            if (metaEl && matched.ta !== undefined) {
              metaEl.textContent = `${matched.ta}°C · ${matched.vv !== undefined ? (matched.vv * 3.6).toFixed(0) + ' km/h' : ''}`;
              metaEl.style.color = "var(--meteo)";
            }
            if (markers[st.id].isPopupOpen()) {
              markers[st.id].setPopupContent(buildMeteoPopupHTML(st));
            }
          }
        });

        statusEl.textContent = `AEMET: OK (${activeCount}/2 EST.)`;
        statusEl.style.color = "var(--meteo)";
      } catch (err) {
        console.error("Error AEMET:", err);
        statusEl.textContent = "AEMET: REINTENTANDO...";
        statusEl.style.color = "var(--dgt)";
      }
    }

    let secondsLeft = 60;
    const countdownEl = document.getElementById('countdown');

    function forceRefresh() {
      cacheBuster = Date.now();
      secondsLeft = 60;
      countdownEl.textContent = secondsLeft;
      CAMERAS.forEach(cam => {
        const marker = markers[cam.id];
        if (marker && marker.isPopupOpen()) {
          marker.setPopupContent(buildPopupHTML(cam));
        }
      });
      fetchAemetLlanes();
    }

    setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        forceRefresh();
      } else {
        countdownEl.textContent = secondsLeft;
      }
    }, 1000);

    fetchAemetLlanes();
  </script>
</body>
</html>
